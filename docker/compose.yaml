### chorus app compose — app services only.
###
### Graph state lives in the data-plane compose project (Neo4j); chorus's
### own state (audit log, raw store, operational logs) lives in the
### external `chorus-state` volume mounted at $CHORUS_HOME. Both are
### `external: true` so `docker compose down -v` in this project is
### always safe — only `docker volume rm` against the named volume can
### destroy chorus-local state. See docs/architecture.md.

name: chorus

##########################################################
# Shared logging — the local driver rotates and compresses
# per-container; tail with `docker compose logs -f <svc>`.
##########################################################
x-logging: &default-logging
  driver: "local"
  options:
    max-size: "50m"
    max-file: "5"
    compress: "true"

##########################################################
# Shared hardening (deploy ADR 0001) — no privilege
# escalation, no capabilities; both images run non-root
# with read-only root filesystems. All backend writes go
# to the chorus-state volume ($CHORUS_HOME).
##########################################################
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  ##########################################################
  # Volume ownership (deploy ADR 0001, self-healing)
  #
  # The backend runs as uid 10001 with a read-only rootfs, but external
  # volumes keep whatever ownership they were created with (root, on a
  # fresh `docker volume create`). This one-shot root container fixes
  # ownership before the backend starts; it reuses the backend image so
  # the airgap bundle needs no extra image. The find form only touches
  # wrong-owner entries. Canonical shape: docint/docker/compose.yaml.
  ##########################################################
  volume-permissions:
    image: chorus-backend:${CHORUS_VERSION:-latest}
    logging: *default-logging
    user: "0:0"
    read_only: true
    security_opt:
      - no-new-privileges:true
    network_mode: none
    # Root is the mountpoint itself — its parent dirs live on the
    # read-only image rootfs and must not (and cannot) be chowned.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        find /var/lib/chorus
        -xdev ! -user 10001 -exec chown -h 10001:10001 {} +
    volumes:
      - chorus-state:/var/lib/chorus
    restart: "no"

  backend:
    <<: *hardened
    image: chorus-backend:${CHORUS_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    logging: *default-logging
    read_only: true
    tmpfs:
      - /tmp:size=64m
    env_file:
      - path: ../.env
        required: false
    environment:
      # Single-project compat default. Multi-project setups (ADR 0017) set
      # CHORUS_PROJECTS + NEO4J_URI_<NAME> in the repo-root .env, which the
      # env_file above forwards verbatim — no per-project compose edits.
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-http://vllm-router:4000/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      CHORUS_HOME: ${CHORUS_HOME:-/var/lib/chorus}
      RESPONSE_LANGUAGE: ${RESPONSE_LANGUAGE:-en}
      # Gates the UI upload-and-run path + /ingestion/* endpoints (ADR 0014).
      # Default off; only the backend reads it (the SPA reads GET /config at startup).
      INGESTION_UI_ENABLED: ${INGESTION_UI_ENABLED:-false}
    volumes:
      - chorus-state:/var/lib/chorus
    networks:
      chorus-net:
        aliases:
          - backend
      inference-net:
        aliases:
          - chorus-backend
      data-net:
        aliases:
          - chorus-backend
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      volume-permissions:
        condition: service_completed_successfully

  frontend:
    <<: *hardened
    image: chorus-frontend:${CHORUS_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    logging: *default-logging
    # nginx (unprivileged image) writes pid/temp under /tmp; the envsubst
    # entrypoint renders the template into /etc/nginx/conf.d at startup.
    read_only: true
    tmpfs:
      - /tmp:size=16m
      # mode=1777: the tmpfs shadows the image dir root-owned; the envsubst
      # entrypoint (uid 101) must be able to render the template into it.
      - /etc/nginx/conf.d:size=1m,mode=1777
    environment:
      # nginx envsubst fills the upload body-size limit in the template.
      CHORUS_CLIENT_MAX_BODY_SIZE: ${CHORUS_CLIENT_MAX_BODY_SIZE:-512m}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      chorus-net:
        aliases:
          - frontend
      edge-net:
        aliases:
          - chorus-frontend
    expose:
      - "8080"
    restart: unless-stopped

networks:
  chorus-net: {}
  inference-net:
    external: true   # owned by the vllm-service compose project
  data-net:
    external: true   # owned by the data-plane compose project
  edge-net:
    external: true
    name: ${EDGE_NET:-edge-net}

volumes:
  chorus-state:
    external: true 